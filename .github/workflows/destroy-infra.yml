name: Destroy Infra and App on GCP

on:
  workflow_dispatch: # Ejecutar manualmente desde la pestaña Actions

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: us-central1
  SERVICE_NAME: hackday-gemini-backend
  FRONTEND_SITE: hackday-frontend
  FRONTEND_DIR: frontend
  TF_DIR: terraform

jobs:
  terraform-destroy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.TF_DIR }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Write GCP credentials to file
        run: |
          echo "${{ secrets.GCP_SA_KEY }}" > gcp-key.json

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init

      - name: Terraform Destroy
        run: terraform destroy -auto-approve \
          -var="project_id=${{ env.PROJECT_ID }}" \
          -var="credentials_file=gcp-key.json"

  cleanup-cloud-run:
    needs: terraform-destroy
    runs-on: ubuntu-latest
    steps:
      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}
          service_account_key: ${{ secrets.GCP_SA_KEY }}
          export_default_credentials: true

      - name: Delete Cloud Run service
        run: |
          if gcloud run services describe $SERVICE_NAME --region $REGION > /dev/null 2>&1; then
            gcloud run services delete $SERVICE_NAME --region $REGION --quiet
          else
            echo "Cloud Run service $SERVICE_NAME no existe, saltando..."
          fi

      - name: Delete Artifact Registry images
        run: |
          gcloud artifacts docker images delete ${REGION}-docker.pkg.dev/$PROJECT_ID/hackday-repo/hackday-gemini-backend:latest \
            --quiet --delete-tags || echo "No image found to delete"

  cleanup-firebase:
    needs: terraform-destroy
    runs-on: ubuntu-latest
    steps:
      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Disable Firebase Hosting deployment
        working-directory: ${{ env.FRONTEND_DIR }}
        run: |
          firebase hosting:disable --token ${{ secrets.FIREBASE_TOKEN }} || echo "No hosting to disable"
