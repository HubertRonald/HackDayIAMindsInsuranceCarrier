name: Deploy Infra and App to GCP

on:
  push:
    branches:
      - main
      - 'releases/**'
  pull_request:
    types: [opened, synchronize]

env:
  PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  REGION: ${{ vars.GCP_REGION }}
  SERVICE_NAME: ${{ vars.GCP_SERVICE_NAME }}
  BACKEND_DIR: ${{ vars.BACKEND_DIR }}
  FRONTEND_DIR: ${{ vars.FRONTEND_DIR }}
  TF_DIR: ${{ vars.TF_DIR }}

jobs:
  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.TF_DIR }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup GCP Key
        run: |
          mkdir -p ${{ env.TF_DIR }}
          echo '${{ secrets.GCP_SA_KEY }}' | sed 's/\\n/\n/g' > ${{ env.TF_DIR }}/gcp-key.json
          echo "✅ GCP key file created at ${{ env.TF_DIR }}/gcp-key.json"
          jq . ${{ env.TF_DIR }}/gcp-key.json > /dev/null
      
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init

      - name: Terraform Apply
        run: |
          terraform apply -auto-approve \
          -var="project_id=${{ env.PROJECT_ID }}" \
          -var="credentials_file=${{ env.TF_DIR }}/gcp-key.json"

  deploy-app:
    needs: terraform
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}
          service_account_key: ${{ secrets.GCP_SA_KEY }}
          export_default_credentials: true

      # =============================
      # 1️⃣ BACKEND (Cloud Run)
      # =============================
      - name: Build and Push Backend Docker image
        run: |
          gcloud auth configure-docker ${REGION}-docker.pkg.dev --quiet
          gcloud builds submit $BACKEND_DIR \
            --tag ${REGION}-docker.pkg.dev/$PROJECT_ID/hackday-repo/$SERVICE_NAME:latest

      - name: Deploy Backend to Cloud Run (with SA auth)
        run: |
          gcloud run deploy $SERVICE_NAME \
            --image ${REGION}-docker.pkg.dev/$PROJECT_ID/hackday-repo/$SERVICE_NAME:latest \
            --region $REGION \
            --platform managed \
            --allow-unauthenticated \
            --set-env-vars GOOGLE_CLOUD_PROJECT=$PROJECT_ID

      - name: Get Cloud Run URL
        id: get-url
        run: |
          URL=$(gcloud run services describe $SERVICE_NAME \
            --region $REGION \
            --project $PROJECT_ID \
            --format 'value(status.url)')
          echo "BACKEND_URL=$URL" >> $GITHUB_ENV

      # =============================
      # 2️⃣ FRONTEND (Firebase Hosting)
      # =============================
      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Validate Firebase Token
        run: |
          echo "🔍 Verificando autenticación con Firebase..."
          firebase list --token "${{ secrets.FIREBASE_TOKEN }}" || (echo "❌ Token inválido o caducado" && exit 1)

      - name: Build Frontend with dynamic API URL
        run: |
          cp $FRONTEND_DIR/.env.example $FRONTEND_DIR/.env
          sed -i '/^REACT_APP_API_URL=/d' $FRONTEND_DIR/.env
          echo "REACT_APP_API_URL=${BACKEND_URL}" >> $FRONTEND_DIR/.env
          cd $FRONTEND_DIR
          npm install
          npm run build

      - name: Deploy Frontend to Firebase Hosting
        working-directory: ${{ env.FRONTEND_DIR }}
        run: firebase deploy --token ${{ secrets.FIREBASE_TOKEN }}
