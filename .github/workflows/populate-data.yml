name: Populate Dummy Data

on:
  workflow_run:
    workflows: ["Deploy Infra and App to GCP"] # Se ejecuta tras el despliegue
    types:
      - completed

  workflow_dispatch: # También ejecutable manualmente desde GitHub Actions

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: us-central1
  GOOGLE_APPLICATION_CREDENTIALS: ${{ github.workspace }}/terraform/gcp-key.json

jobs:
  populate-data:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install Python dependencies
        working-directory: data
        run: |
          python -m pip install --upgrade pip
          pip install google-cloud-bigquery google-cloud-firestore

      - name: Authenticate with GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Validate BigQuery dataset
        run: |
          if ! gcloud bigquery datasets describe hackday_data --project=${{ env.PROJECT_ID }}; then
            echo "❌ Dataset BigQuery no encontrado. Asegúrate de ejecutar Terraform primero."
            exit 1
          fi

      - name: Validate Firestore
        run: |
          if ! gcloud firestore databases describe --project=${{ env.PROJECT_ID }} --location=nam5; then
            echo "❌ Firestore no encontrado. Asegúrate de ejecutar Terraform primero."
            exit 1
          fi

      - name: Generate Dummy Data
        working-directory: data
        run: |
          python generate_dummy_data.py

      - name: Load Dummy Data into BigQuery & Firestore
        working-directory: data
        run: |
          python load_dummy_data.py
