name: Populate Dummy Data

on:
  workflow_run:
    workflows: ["Deploy Infra and App to GCP"] # Se ejecuta tras el despliegue
    types:
      - completed

  workflow_dispatch: # También ejecutable manualmente desde GitHub Actions

env:
  GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  REGION: ${{ vars.GCP_REGION }}
  DATA_DIR: data

jobs:
  populate-data:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install Python dependencies
        working-directory: ${{ env.DATA_DIR }}
        run: |
          python -m pip install --upgrade pip
          pip install google-cloud-bigquery google-cloud-firestore

      - name: Authenticate with GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up gcloud CLI
        uses: google-github-actions/setup-gcloud@v2

      - name: Validate BigQuery dataset
        run: |
          echo "🔍 Validando dataset BigQuery..."
          if ! bq show --format=prettyjson "${{ env.GCP_PROJECT_ID }}:hackday_data" >/dev/null; then
            echo "❌ Dataset BigQuery no encontrado. Asegúrate de ejecutar Terraform primero."
            exit 1
          fi

      - name: Validate Firestore
        run: |
          echo "🔍 Validando instancia Firestore..."
          if ! gcloud firestore databases describe --project="${{ env.GCP_PROJECT_ID }}" --database="(default)" >/dev/null; then
            echo "❌ Firestore no encontrado. La base '(default)' debe existir previamente en el proyecto."
            exit 1
          fi

      - name: Generate Dummy Data
        working-directory: ${{ env.DATA_DIR }}
        run: |
          echo "⚙️ Generando datos dummy..."
          python generate_dummy_data.py

      - name: Load Dummy Data into BigQuery & Firestore
        working-directory: ${{ env.DATA_DIR }}
        run: |
          echo "📥 Cargando datos dummy a BigQuery y Firestore..."
          python load_dummy_data.py
